version: '3.8'

services:
  essl-sync:
    build: ./essl-sync
    env_file: ./essl-sync/.env
    ports:
      - "127.0.0.1:5000:5000"     # localhost only — never 0.0.0.0
    volumes:
      - ./essl-sync/sync.log:/app/sync.log
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp]
    networks: [attendance_net]

networks:
  attendance_net:
    driver: bridge
    internal: true
