groups:
  - name: attendance-alerts
    rules:
      - alert: DeviceDisconnected
        expr: up{job="essl-sync"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "eSSL device is unreachable"

      - alert: HighErrorRate
        expr: rate(http_requests_total{http_status=~"5.."}[5m]) > 0.1
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Elevated 5xx error rate on essl-sync"
