name: eSSL Attendance Sync

on:
  schedule:
    - cron: '30 5 * * *'    # 11:00 AM IST
    - cron: '30 14 * * *'   # 8:00 PM IST
  workflow_dispatch:

concurrency:
  group: essl-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: self-hosted        # MUST run inside your factory LAN
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ESSL_DEVICE_IP: ${{ secrets.ESSL_DEVICE_IP }}
      ESSL_DEVICE_PORT: ${{ secrets.ESSL_DEVICE_PORT }}
      ESSL_COMM_KEY: ${{ secrets.ESSL_COMM_KEY }}
      ESSL_DEVICE_ID: ${{ secrets.ESSL_DEVICE_ID }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      FACTORY_TIMEZONE: 'Asia/Kolkata'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('essl-sync/requirements.txt') }}

      - name: Install dependencies
        working-directory: essl-sync
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ping device
        run: |
          if ! ping -c 2 -W 3 "$ESSL_DEVICE_IP" >/dev/null 2>&1; then
            echo "::error::Device $ESSL_DEVICE_IP unreachable."
            exit 1
          fi

      - name: Run sync with retries
        working-directory: essl-sync
        run: |
          set -e
          for attempt in 1 2 3; do
            if python sync.py --once; then
              exit 0
            fi
            echo "::warning::Attempt $attempt failed; retrying in 15s"
            sleep 15
          done
          echo "::error::All attempts failed"
          exit 1

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: essl-sync-log-${{ github.run_id }}
          path: essl-sync/sync.log
          retention-days: 14

      - name: Notify Slack on failure
        if: failure() && env.SLACK_WEBHOOK != ''
        uses: slackapi/slack-github-action@v1.27.0
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          payload: |
            {"text": "🚨 eSSL sync FAILED — run ${{ github.run_id }}"}
